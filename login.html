<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - RS Sehat Sentosa</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="halaman-login">
<main class="login-box">
  <div class="login-info">
    <h1>RS Sehat Sentosa</h1>
    <p>Masuk untuk melihat jadwal dokter, layanan, dan membuat janji temu.</p>
    <p class="petunjuk">Rumah sakit umum tipe B. Melayani sejak 1998.</p>
  </div>
  <div class="login-form">
    <h2>Masuk</h2>
    <p class="petunjuk">Gunakan akun petugas atau pasien terdaftar.</p>
    <form id="formLogin" class="form-login">
      <div class="form">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <p id="pesanError" class="pesan-error" role="alert"></p>
        <button type="submit" class="tombol">Masuk</button>
      </div>
    </form>
  </div>
</main>
<script src="js/login.js"></script>
</body>
</html>
